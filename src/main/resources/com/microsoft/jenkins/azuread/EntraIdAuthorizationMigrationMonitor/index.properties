intro=The Entra ID matrix-based authorization strategy is deprecated. \
  The Matrix Authorization Strategy and Role-based Authorization Strategy plugins can now search Entra ID for users and groups, \
  so this plugin no longer needs to provide its own authorization strategy. \
  This page converts your existing permissions to the Matrix Authorization Strategy plugin.
willMigrate=will be replaced by
migrated=was replaced by
before=Consider backing up your Jenkins home directory before migrating. \
  If you manage Jenkins using configuration as code, update your configuration after migrating, \
  for example by exporting it from the Configuration as Code page.
failed=The migration could not be completed. Nothing was changed.
done=Jenkins no longer uses the Entra ID matrix-based authorization strategy. \
  You can review permissions in the <a href="{0}/manage/configureSecurity/">security configuration</a>.
